# nginx inside the Orbit container (non-root, port 8080). Based on web/deploy/nginx.conf (tvBro production), with:
# plain HTTP on the LAN (TLS, if wanted, belongs to a reverse proxy or Tailscale in front), the Host header passed
# WITH its port ($http_host: the server compares Origin with Host), /v1 (Orbit API) proxied too, and
# X-Forwarded-For passed on, so client addresses survive another reverse proxy in front (ORBIT_TRUSTED_PROXIES).
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx/body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    sendfile on;
    server_tokens off;
    # no query strings in the log (they can name image URLs or search words)
    # and no device logins: a linked TV's facade addresses (/xt/<playlist>/<kind>/<user>/<secret>/...) carry them
    map $uri $orbit_loguri {
        ~^(?<pre>/xt/[^/]+/[a-z]+/)[^/]+/[^/]+(?<post>.*)$ $pre-/-$post;
        default $uri;
    }
    log_format orbit_noquery '$remote_addr [$time_local] "$request_method $orbit_loguri" $status $body_bytes_sent';
    access_log /dev/stdout orbit_noquery;

    # A TLS reverse proxy in front (docs/orbit/DEPLOY.md) says the page was https: keep that, so session cookies get
    # "Secure". Anyone else claiming https only makes their own cookie unusable over plain HTTP.
    map $http_x_forwarded_proto $orbit_proto {
        default $scheme;
        https https;
    }

    server {
        listen 8080;
        root /opt/orbit/frontend;
        index index.html;
        client_max_body_size 4m;

        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

        location / {
            try_files $uri $uri/ /index.html;
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header X-Frame-Options DENY always;
            add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        }
        # version-stamped at build (?v=<commit>), so they can be cached for a long time
        location ~ \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
        }
        location ~ ^/(api|v1|xt|stream|seg|vodstream|img|remux|rec)(/|$|\?) {
            proxy_pass http://127.0.0.1:8750;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # the client chain: whatever came in, plus the address nginx saw. The Python server believes it only
            # from ORBIT_TRUSTED_PROXIES (loopback = this nginx) and takes the right-most untrusted address.
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $orbit_proto;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Frame-Options;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Connection "";
        }
    }
}
